<style>
  :root {
    /* ZedLevel brand — identical to the speaking test */
    --brand:#1b46f5; --brand-2:#3d63ff; --brand-ink:#0f2ea8;
    --gold:#f2ba40; --gold-2:#f7cf6b; --gold-ink:#a5720a;
    --bg:#eef2fb; --bg-2:#e2e8f7;
    --ink:#111634; --muted:#5a6488; --faint:#8a93b8;
    --card:#ffffff; --soft:#f4f6fd;
    --wa:#22c55e; --wa-2:#128a3e;
    --line:rgba(17,22,52,.08); --line-2:rgba(17,22,52,.14);
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:"Cairo",system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink);
    min-height:100dvh;
    padding:14px 12px calc(22px + env(safe-area-inset-bottom));
    background:
      radial-gradient(420px 420px at 100% -6%, rgba(27,70,245,.13), transparent 70%),
      radial-gradient(360px 360px at 0% 104%, rgba(124,139,255,.16), transparent 70%),
      radial-gradient(120% 80% at 50% -10%, #ffffff 0%, transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility;
  }

  /* vertical column: card on top, socials below */
  .page { position:relative; width:100%; max-width:420px; margin:0 auto; }

  /* the card — same shell as the speaking test */
  .card {
    position:relative; width:100%; display:flex; flex-direction:column;
    background:var(--card);
    border:1px solid var(--line-2); border-radius:26px; overflow:hidden;
    box-shadow:0 30px 70px -30px rgba(27,70,245,.28), 0 12px 30px -14px rgba(17,22,52,.14), inset 0 1px 0 #fff; }
  .card::before { content:""; position:absolute; top:0; left:0; right:0; height:5px;
    background:linear-gradient(90deg,var(--brand) 0%, var(--brand-2) 55%, var(--gold) 100%); z-index:3; }

  /* brand header — kept short: every pixel it takes is a pixel a button loses */
  .brandbar { display:flex; align-items:center; justify-content:center;
    padding:17px 20px 11px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#fbfcff, #f4f7ff); }
  .brandbar img { height:42px; width:auto; max-width:80%; object-fit:contain; }

  .inner { padding:14px 14px 14px; text-align:center; }

  .badge { display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:800;
    color:var(--brand-ink); background:rgba(27,70,245,.08); border:1px solid rgba(27,70,245,.18);
    padding:5px 13px; border-radius:999px; margin-bottom:9px; }
  .badge .pip { position:relative; width:8px; height:8px; flex:none; }
  .badge .pip::before { content:""; position:absolute; inset:0; border-radius:50%; background:var(--wa); }
  .badge .pip::after { content:""; position:absolute; inset:-3px; border-radius:50%; border:1px solid var(--wa); opacity:.55; animation:ping 2.2s ease-out infinite; }
  @keyframes ping { 0%{transform:scale(.6);opacity:.6} 100%{transform:scale(1.7);opacity:0} }

  .hl { font-size:23px; font-weight:900; line-height:1.35; color:var(--ink); }
  .proof { font-size:13px; line-height:1.6; color:var(--muted); font-weight:700; margin:2px 0 13px; }
  .proof b { color:var(--brand); font-weight:900; }

  /* ===== the buttons — each one is a whole-row tap target, all visible at once ===== */
  .links { display:flex; flex-direction:column; gap:10px; }
  .lnk {
    display:flex; align-items:center; gap:11px; text-decoration:none; text-align:right; color:var(--ink);
    background:#fff; border:1.5px solid var(--line-2); border-radius:18px; padding:11px 13px; min-height:66px;
    position:relative; overflow:hidden;
    box-shadow:0 10px 20px -16px rgba(17,22,52,.45);
    transition:border-color .2s, transform .12s, box-shadow .2s; }
  .lnk:active { transform:scale(.98); }
  @media (hover:hover){ .lnk:hover { border-color:var(--brand); box-shadow:0 12px 26px -14px rgba(27,70,245,.4); } }
  .lnk .ic { flex:none; width:44px; height:44px; border-radius:13px; display:grid; place-items:center;
    font-size:22px; line-height:1; background:var(--soft); border:1px solid var(--line-2); }
  .lnk .ic svg { width:25px; height:25px; }
  .lnk .tx { flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; }
  .lnk .t { font-size:15.5px; font-weight:800; line-height:1.3; }
  .lnk .s { font-size:12.5px; font-weight:600; color:var(--muted); margin-top:2px; line-height:1.4; }
  .lnk .chev { flex:none; width:20px; height:20px; opacity:.9; }

  /* price at the row's end: number, riyal mark, unit under it */
  .pr { flex:none; display:flex; flex-direction:column; align-items:center; }
  .pr .n { display:inline-flex; align-items:center; gap:3px; font-size:17px; font-weight:900; line-height:1.2;
    color:var(--brand-ink); white-space:nowrap; }
  .pr .n svg { width:.82em; height:.82em; flex:none; }
  .pr .u { font-size:10.5px; font-weight:700; color:var(--faint); margin-top:1px; white-space:nowrap; }

  /* the featured course — the one solid, coloured block on the page */
  .lnk.feat { background:linear-gradient(150deg,var(--brand-2) 0%,var(--brand) 55%,var(--brand-ink) 100%);
    border-color:transparent; color:#fff; min-height:82px; padding:13px 13px;
    box-shadow:0 18px 30px -16px rgba(27,70,245,.75); }
  .lnk.feat .ic { background:#fff; border-color:transparent; width:48px; height:48px; font-size:24px; }
  .lnk.feat .t { font-size:16.5px; font-weight:900; }
  .lnk.feat .s { color:rgba(255,255,255,.88); }
  .lnk.feat .tag { font-size:10.5px; font-weight:800; line-height:1.5; color:#fff; background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.3); padding:0 8px; border-radius:999px; margin-bottom:4px; }
  .lnk.feat .pr .n { color:#3d2a02; background:linear-gradient(150deg,var(--gold-2),var(--gold));
    padding:5px 10px; border-radius:999px; font-size:17.5px; box-shadow:0 6px 12px -6px rgba(0,0,0,.45); }
  .lnk.feat .pr .u { color:rgba(255,255,255,.85); }
  /* light sweep — on ::after, so it can never replace the row's own animation */
  .lnk.feat::after { content:""; position:absolute; top:0; bottom:0; width:38%; left:-60%; pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent); transform:skewX(-20deg); animation:sheen 4.5s ease-in-out 1s infinite; }
  @keyframes sheen { 0%,60%{left:-60%} 90%,100%{left:170%} }

  /* WhatsApp — solid green, for whoever would rather ask than read */
  .lnk.wa { background:linear-gradient(150deg,#22b358,var(--wa-2)); border-color:transparent; color:#fff;
    box-shadow:0 14px 24px -16px rgba(18,138,62,.9); }
  .lnk.wa .ic { background:rgba(255,255,255,.18); border-color:rgba(255,255,255,.3); color:#fff; }
  .lnk.wa .s { color:rgba(255,255,255,.92); }

  /* the plain site link — third in rank, so it is text, not a block */
  .site { display:inline-flex; align-items:center; gap:6px; margin-top:6px; padding:10px 12px;
    font-size:13px; font-weight:800; color:var(--brand-ink); text-decoration:none; }
  .site span[dir="ltr"] { text-decoration:underline; text-underline-offset:3px; }

  /* social media squares — below the card */
  .socials-wrap { width:100%; max-width:420px; margin:16px auto 0; text-align:center; }
  .soc-label { font-size:12px; font-weight:800; color:var(--muted); margin-bottom:10px; letter-spacing:.02em; }
  .socials { display:flex; justify-content:center; gap:14px; }
  .soc { width:48px; height:48px; border-radius:15px; display:grid; place-items:center; text-decoration:none; color:#fff;
    box-shadow:0 12px 24px -12px rgba(17,22,52,.5); transition:transform .16s ease; }
  .soc svg { width:23px; height:23px; }
  .soc:active { transform:scale(.94); }
  .soc.s-insta  { background:linear-gradient(135deg,#feda75,#fa7e1e 30%,#d62976 60%,#962fbf 90%); }
  .soc.s-tiktok { background:linear-gradient(150deg,#25f4ee,#111 55%,#fe2c55); }
  .soc.s-tg     { background:linear-gradient(150deg,#37bdf5,#1d93d2); }

  .foot { text-align:center; font-size:11px; color:var(--faint); padding:0 0 12px; font-weight:700; letter-spacing:.02em; }
  .foot b { color:var(--muted); font-weight:800; }

  /* ===== entrance =====
     Nothing here is hidden by its own style. The fade lives ONLY in the keyframe,
     so a row whose animation is replaced or never runs is simply visible. The old
     page set opacity:0 on every row and relied on the animation to undo it; the
     featured row had a second animation, lost the first, and stayed invisible. */
  @keyframes riseIn { from{opacity:0; transform:translateY(10px)} }
  .badge, .hl, .proof, .links > * { animation:riseIn .42s cubic-bezier(.16,1,.3,1) both; }
  .links > *:nth-child(1){ animation-delay:.03s } .links > *:nth-child(2){ animation-delay:.07s }
  .links > *:nth-child(3){ animation-delay:.11s } .links > *:nth-child(4){ animation-delay:.15s }

  @media (max-width:374px){
    body{padding-inline:9px} .inner{padding:12px 10px 12px}
    .hl{font-size:21px} .lnk{gap:9px; padding:10px 11px} .lnk .t{font-size:14.5px} .lnk.feat .t{font-size:15px}
    .lnk .s{font-size:12px} .lnk .ic{width:40px; height:40px; font-size:20px} .lnk.feat .ic{width:42px; height:42px; font-size:21px}
    .pr .n{font-size:16px} .lnk.feat .pr .n{font-size:16px; padding:4px 8px}
  }
  @media (prefers-reduced-motion:reduce){
    .badge .pip::after,.lnk.feat::after,.badge,.hl,.proof,.links > *{ animation:none!important; }
  }
</style>
</head>

    ,{ key:"step",   emoji:"🎓", name:"دورة STEP",            desc:"اختبار ستيب",     price:"", unit:"", wa:"...", enabled:false }
    */
  ];

  /* the WhatsApp row under the courses */
  const WHATSAPP = { enabled:true, title:"اسألنا على واتساب", sub:"نحدد مستواك ونقترح الدورة المناسبة" };

  /* --- SVG icons --- */
  const ICONS = {
    wa:       '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm0 18.13c-1.52 0-3-.41-4.3-1.18l-.31-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.37c0-4.54 3.7-8.23 8.24-8.23 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.82c0 4.54-3.7 8.24-8.11 8.25zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.23.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28z"/></svg>',
    insta:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.2" fill="currentColor" stroke="none"/></svg>',
    tiktok:   '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3c.3 2.1 1.5 3.6 3.5 3.9v2.4c-1.3.1-2.5-.3-3.6-1v5.9c0 3.6-2.6 5.9-5.7 5.9-2.9 0-5.2-2.1-5.2-5 0-3.1 2.6-5.2 5.9-4.8v2.6c-.4-.1-.9-.2-1.3-.2-1.3 0-2.2.9-2.2 2.2 0 1.4 1 2.3 2.3 2.3 1.4 0 2.4-1 2.4-2.9V3h3.4z"/></svg>',
    tg:       '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.6 20c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.3-.1-.5-.6-.2L6.2 13 1.4 11.5c-1-.3-1-1 .2-1.5L20.6 2.6c.9-.3 1.6.2 1.3 1.7z"/></svg>',
    /* drawn, not typed: «‹» is a mirrored character, and in an RTL line it comes out pointing backwards */
    chev:     '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
    /* the Saudi riyal mark — the same glyph the website prints after a price */
    riyal:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="ريال سعودي"><path d="m20 19.5-5.5 1.2"/><path d="M14.5 4v11.22a1 1 0 0 0 1.242.97L20 15.2"/><path d="m2.978 19.351 5.549-1.363A2 2 0 0 0 10 16V2"/><path d="M20 10 4 13.5"/></svg>'
  };

  /* --- BELOW the card: social media squares --- */
  const SOCIALS = [
    { key:"insta", label:"إنستقرام", href:CONFIG.instagramUrl, enabled:true },
    { key:"tiktok",label:"تيك توك",  href:CONFIG.tiktokUrl, enabled:true },
    { key:"tg",    label:"تيليجرام", href:CONFIG.telegramUrl, enabled:true }
  ];

  /* --- where the visitor came from ---
     Read off the in-app browser, because the same link can sit in more than one
     profile. It labels the visit when it reaches zedlevel.com: without a label
     the website files every visitor from this page under "direct". */
  var FROM = (function(){
    var s = (navigator.userAgent || "") + " " + (document.referrer || "");
    if (/tiktok|musical_ly|bytedance/i.test(s)) return "tiktok";
    if (/instagram/i.test(s)) return "instagram";
    if (/telegram|\/\/t\.me/i.test(s)) return "telegram";
    if (/snapchat/i.test(s)) return "snapchat";
    return "bio";
  })();

  /* --- render --- */
  function waLink(msg){ return "https://wa.me/"+CONFIG.whatsappNumber+"?text="+encodeURIComponent(msg); }
  /* utm_* is right HERE and wrong on the website's buy buttons: this is the
     visitor's way IN to the site, which is what the tags are for. A tag on a
     button inside the site would overwrite the source they arrived with. */
  function siteLink(path, key){
    return CONFIG.websiteUrl + path + "?utm_source=" + FROM + "&utm_medium=bio&utm_campaign=bio_link&utm_content=" + key;
  }

  /* No target="_blank" anywhere on this page. It is opened inside TikTok's own
     browser, where a link that asks for a new window is the one kind that can
     fail without a trace; a plain link always navigates, and Back returns here. */
  var rows = COURSES.filter(function(c){ return c.enabled; }).map(function(c){
    var href = c.wa ? waLink(c.wa) : siteLink(c.path, c.key);
    var price = c.price
      ? '<span class="pr"><span class="n"><span dir="ltr">'+c.price+'</span>'+ICONS.riyal+'</span>'+
        (c.unit ? '<span class="u">'+c.unit+'</span>' : '')+'</span>'
      : ICONS.chev;
    return '<a class="lnk'+(c.feat?' feat':'')+'" data-k="'+c.key+'" href="'+href+'">'+
             '<span class="ic">'+c.emoji+'</span>'+
             '<span class="tx">'+(c.tag ? '<span class="tag">'+c.tag+'</span>' : '')+
               '<span class="t">'+c.name+'</span><span class="s">'+c.desc+'</span></span>'+
             price+
           '</a>';
  });
  if (WHATSAPP.enabled) {
    rows.push('<a class="lnk wa" data-k="whatsapp" href="'+waLink(CONFIG.whatsappMsg)+'">'+
                '<span class="ic">'+ICONS.wa+'</span>'+
                '<span class="tx"><span class="t">'+WHATSAPP.title+'</span><span class="s">'+WHATSAPP.sub+'</span></span>'+
                ICONS.chev+
              '</a>');
  }
  document.getElementById("links").innerHTML = rows.join("");
  document.getElementById("site").href = siteLink("/", "site");

  document.getElementById("socials").innerHTML = SOCIALS.filter(function(s){ return s.enabled; }).map(function(s){
    return '<a class="soc s-'+s.key+'" data-k="'+s.key+'" href="'+s.href+'" aria-label="'+s.label+'">'+ICONS[s.key]+'</a>';
  }).join("");

  document.getElementById("year").textContent = new Date().getFullYear();

  /* --- measuring ---
     One page view per visit, one event per tap. In GA4: taps ÷ views is this
     page's click rate, and `link` says which button took the tap. WhatsApp uses
     the website's own event name so it lands beside the site's WhatsApp taps. */
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  if (CONFIG.ga4Id) {
    var g = document.createElement("script");
    g.async = true; g.src = "https://www.googletagmanager.com/gtag/js?id=" + CONFIG.ga4Id;
    document.head.appendChild(g);
    gtag("js", new Date());
    gtag("config", CONFIG.ga4Id);
    document.addEventListener("click", function(e){
      var a = e.target && e.target.closest ? e.target.closest("a[data-k]") : null;
      if (!a) return;
      var k = a.getAttribute("data-k");
      if (k === "whatsapp") gtag("event", "whatsapp_click", { source:"bio" });
      else gtag("event", "bio_click", { link:k, source:"bio" });
    });
  }
</script>
</body>
